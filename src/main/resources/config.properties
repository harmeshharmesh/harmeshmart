# HarmeshMart Application Configuration
# JDBC and Database
db.driver=org.h2.Driver
db.url=jdbc:h2:file:./data/harmeshmart;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
db.username=sa
db.password=

# Connection Pool Settings (HikariCP)
db.pool.maximumPoolSize=10
db.pool.minimumIdle=2
db.pool.idleTimeout=30000
db.pool.connectionTimeout=20000

# Application Settings
app.name=HarmeshMart
app.currency.symbol=₹
app.session.timeout.minutes=30

# AI Chatbot Integration (Section 17)
# Options: mock | gemini
ai.chatbot.provider=mock
ai.chatbot.gemini.key=
ai.chatbot.rateLimitPerMinute=10
ai.chatbot.maxInputLength=500
