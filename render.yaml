# ==============================================================================
# Render.com Blueprint Infrastructure-as-Code Specification
# Deploy HarmeshMart E-Commerce Platform as a Docker Web Service on Render
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================

services:
  - type: web
    name: harmeshmart
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true

    envVars:
      # In-Memory H2 Database for Render Free Tier (auto-creates & seeds all tables on boot)
      - key: DB_URL
        value: jdbc:h2:mem:harmeshmart;DB_CLOSE_DELAY=-1
      - key: DB_USERNAME
        value: sa
      - key: DB_PASSWORD
        value: ""

      # AI Chatbot Provider: 'mock' (default) or 'gemini' (requires GEMINI_API_KEY)
      - key: AI_CHATBOT_PROVIDER
        value: mock
      - key: GEMINI_API_KEY
        sync: false

      # JVM Memory Options tuned for Render 512MB container
      - key: JAVA_OPTS
        value: -Xms128m -Xmx384m -XX:+UseG1GC -Djava.awt.headless=true
